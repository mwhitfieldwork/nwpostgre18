
<section class="login">

    <img src="assets/nw-logo.png" alt="logo" class="logo-nw"/>

    <mat-card class="p-3 mb-4">
        <article>
            <div class="google-login">
                @if(isLoggedIn){
                    <button (click)="logout()"><img src="assets/google-logo.png" alt="Google Icon"/> Logout with Google</button>
                }@else{
                    <span (click)="login()"><img src="assets/google-logo.png" alt="Google Icon"/> Login with Google</span>
                }
            </div>
            <app-auth-form (submitted)="verifyUser($event)" [signInErrorMessage]="signInErrorMessage">
                <!-- ngProjectAs: can be used anywhere  but limits use to inside the projected component-->
                <h3>Log In</h3>
                <!-- If I were to use the appButton template variablehere I would get the ButtonComponent not the HTMLButtonElement -->  
                <button 
                type="submit"
                class="btn btn-warning" 
                appButton #appButton>Log In
                <span ngProjectAs="icon"> ></span></button>  
            </app-auth-form>
        </article>
    </mat-card>
</section>
